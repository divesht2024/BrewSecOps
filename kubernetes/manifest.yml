---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brewsecureops-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: brewsecureops
  template:
    metadata:
      labels:
        app: brewsecureops
    spec:
      containers:
      - name: brewsecureops-container
        image: denver16/brewsecureops:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: brewsecureops-service
spec:
  type: LoadBalancer
  selector:
    app: brewsecureops
  ports:
  - port: 80
    targetPort: 3000
